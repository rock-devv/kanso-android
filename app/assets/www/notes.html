<!DOCTYPE html>
<html>
	<head>
		<title>Kanso — Notes</title>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, user-scalable=no"
		/>

		<link href="css/lora/lora.css" rel="stylesheet" type="text/css" />
		<link href="css/style.css" rel="stylesheet" />
		<link href="css/fonts.css" rel="stylesheet" />
		<link href="css/mobile.css?v=8" rel="stylesheet" />
		<link href="css/notes.css?v=8" rel="stylesheet" />
	</head>

	<body class="yin">
		<div class="notes-wrap">
			<header class="notes-title" contenteditable="false">
				ZenPen
			</header>

			<p class="notes-subtitle">A quiet place for every piece of writing.</p>

			<button class="new-note">＋&nbsp; New note</button>

			<div class="note-search" hidden>
				<input
					type="search"
					class="note-search-input"
					placeholder="Search notes"
					autocomplete="off"
				/>
				<button class="note-search-clear" hidden>clear</button>
			</div>

			<ul class="note-list"></ul>

			<p class="notes-empty" hidden>
				Nothing here yet. Start your first note.
			</p>

			<p class="notes-hint" hidden>
				Tip: hold a note to share it without opening.
			</p>
		</div>

		<script src="js/zenpen-storage.js"></script>
		<script src="js/notes.js"></script>
	</body>
</html>
